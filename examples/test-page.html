<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VibeMark Test Page</title>
    <style>
      body {
        background: #f4f6f8;
        color: #17191f;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
      }

      main {
        display: grid;
        gap: 18px;
        grid-template-columns: 240px 1fr 320px;
        min-height: 100vh;
        padding: 28px;
      }

      aside,
      section {
        background: #fff;
        border: 2px solid #111;
        border-radius: 8px;
        padding: 18px;
      }

      h1 {
        font-size: 34px;
        margin: 0 0 18px;
      }

      .hero {
        min-height: 420px;
      }

      .box {
        align-items: center;
        background: #e8f7f1;
        border: 2px dashed #20c997;
        display: flex;
        height: 160px;
        justify-content: center;
        margin-top: 24px;
      }

      button {
        background: #ef3f4f;
        border: 0;
        border-radius: 8px;
        color: white;
        font: inherit;
        font-weight: 800;
        min-height: 44px;
        padding: 0 18px;
      }

      .cards {
        display: grid;
        gap: 12px;
      }

      .card {
        background: #f9fafb;
        border: 1px solid #d7dae2;
        border-radius: 8px;
        min-height: 88px;
        padding: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <aside>
        <h2>Sidebar</h2>
        <p>Hover here to inspect selector and dimensions.</p>
      </aside>

      <section class="hero">
        <h1>VibeMark Test Page</h1>
        <p>Draw a rectangle, arrow, oval, or callout. The HUD should show coordinates while you move.</p>
        <div class="box">
          <button>Primary Action</button>
        </div>
      </section>

      <section>
        <h2>Cards</h2>
        <div class="cards">
          <div class="card">Card A</div>
          <div class="card">Card B</div>
          <div class="card">Card C</div>
        </div>
      </section>
    </main>
  </body>
</html>
